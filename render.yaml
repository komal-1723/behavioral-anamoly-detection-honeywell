services:
  # Backend FastAPI Service (100% Free Tier)
  - type: web
    name: aegis-ueba-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.main
    envVars:
      - key: SECRET_KEY
        value: super-secret-cyber-ueba-key-2026-antigravity
      - key: DATABASE_URL
        value: sqlite:///./cyber_ueba.db

  # Frontend Static Site (100% Free Tier)
  - type: web
    name: aegis-ueba-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
